name: Release Artifacts

# Builds the core on every platform and uploads ONE artifact per platform: the archive a person
# downloads, and nothing else. No tests and no test-result files here; the CI workflow runs the
# suite on the same push. A run's artifacts are exactly the five release archives, each made and
# proved by scripts/package.sh or scripts/package.ps1: one folder inside, holding the core, its
# info file and the two licenses.
#
# Push a ci/release-artifacts-<version> branch to produce a set (ci/release-artifacts-0-1-0 for
# 0.1.0). The branch name carries the version, and the version guard refuses any branch whose
# version disagrees with the project's, so a mislabeled artifact cannot escape. The release itself
# is made by hand, after the five archives have been installed and run.
#
# Self-hosted-runner safety: no pull_request family, so a run is only startable by someone who can
# push here, as with ci.yml.
on:
  push:
    branches:
      - 'ci/release-artifacts-*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Version guard ────────────────────────────────────────────────────────────
  # The branch ships one version: the one its name ends in. The project's version lives in
  # CMakeLists.txt, and the core's info file repeats it for the frontend; all three must agree, or
  # every build job is blocked. Cut a fresh ci/release-artifacts-<version> branch per release.
  guard-version:
    name: Guard version
    runs-on: [self-hosted, Linux, X64, beefserve]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
      - name: Branch, project and info file versions must agree
        run: |
          set -eu
          branch_version="$(echo "${GITHUB_REF_NAME##*release-artifacts-}" | tr - .)"
          project_version="$(sed -n 's/^project(.*VERSION[[:space:]]\{1,\}\([0-9.]*\).*/\1/p' \
            "$GITHUB_WORKSPACE/CMakeLists.txt" | head -1)"
          info_version="$(sed -n 's/^display_version = "\([0-9.]*\)"/\1/p' \
            "$GITHUB_WORKSPACE/src/snaggletooth_libretro.info" | head -1)"
          echo "branch: $branch_version   project: $project_version   info: $info_version"
          if [ "$branch_version" != "$project_version" ]; then
            echo "error: this branch ships $branch_version but the project is $project_version." >&2
            echo "       cut ci/release-artifacts-$(echo "$project_version" | tr . -) instead." >&2
            exit 1
          fi
          if [ "$info_version" != "$project_version" ]; then
            echo "error: the info file says $info_version but the project is $project_version." >&2
            exit 1
          fi

  # ── Linux x64 (beefserve) ────────────────────────────────────────────────────
  linux-x64:
    name: Linux x64 (beefserve)
    runs-on: [self-hosted, Linux, X64, beefserve]
    needs: guard-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          submodules: true

      - name: Build the core
        run: |
          set -eu
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNAGGLETOOTH_LIBRETRO_BUILD_TESTS=OFF
          cmake --build "$GITHUB_WORKSPACE/build-release" --parallel

      - name: Package
        env:
          ASSET: snaggletooth_libretro-linux-x64
        run: |
          set -eu
          sh "$GITHUB_WORKSPACE/scripts/package.sh" \
            "$GITHUB_WORKSPACE/build-release/snaggletooth_libretro.so" \
            "$GITHUB_WORKSPACE/build-release/package" \
            "$GITHUB_WORKSPACE/$ASSET.zip" \
            "$ASSET"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snaggletooth_libretro-linux-x64
          path: snaggletooth_libretro-linux-x64.zip
          if-no-files-found: error

  # ── Windows x64 (WINDOWS-BVDA56O) ────────────────────────────────────────────
  windows-x64:
    name: Windows x64 (WINDOWS-BVDA56O)
    runs-on: [self-hosted, X64, Windows, WINDOWS-BVDA560]
    needs: guard-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build the core
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\snaggletooth-libretro-release-build `
            -G "Visual Studio 17 2022" -A x64 -DSNAGGLETOOTH_LIBRETRO_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:\snaggletooth-libretro-release-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: powershell
        run: |
          $asset = "snaggletooth_libretro-windows-x64"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\package.ps1" `
            -Module C:\snaggletooth-libretro-release-build\Release\snaggletooth_libretro.dll `
            -WorkDir C:\snaggletooth-libretro-release-build\package `
            -Output "$env:GITHUB_WORKSPACE\$asset.zip" `
            -Asset $asset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snaggletooth_libretro-windows-x64
          path: snaggletooth_libretro-windows-x64.zip
          if-no-files-found: error

  # ── macOS ARM64 (ericmacmini) — first of the three ARM64 jobs on the one host ─
  # The dylib carries the linker's ad-hoc signature and is not notarized; the README tells a
  # downloader to clear the quarantine attribute before the frontend loads it.
  macos-arm64:
    name: macOS ARM64 (ericmacmini)
    runs-on: [self-hosted, macOS, ARM64, ericmacmini]
    needs: guard-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          submodules: true

      - name: Build the core
        run: |
          set -eu
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNAGGLETOOTH_LIBRETRO_BUILD_TESTS=OFF
          cmake --build "$GITHUB_WORKSPACE/build-release" --parallel

      - name: Package
        env:
          ASSET: snaggletooth_libretro-macos-arm64
        run: |
          set -eu
          sh "$GITHUB_WORKSPACE/scripts/package.sh" \
            "$GITHUB_WORKSPACE/build-release/snaggletooth_libretro.dylib" \
            "$GITHUB_WORKSPACE/build-release/package" \
            "$GITHUB_WORKSPACE/$ASSET.zip" \
            "$ASSET"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snaggletooth_libretro-macos-arm64
          path: snaggletooth_libretro-macos-arm64.zip
          if-no-files-found: error

  # ── Linux ARM64 (linmac-arm64) — second on the shared host ───────────────────
  linux-arm64:
    name: Linux ARM64 (linmac-arm64)
    runs-on: [self-hosted, Linux, ARM64, linmac-arm64]
    needs: [guard-version, macos-arm64]
    # Runs after macOS whether it passed or failed (shared host), but never past a failed version guard.
    if: ${{ always() && needs.guard-version.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          submodules: true

      - name: Build the core
        run: |
          set -eu
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSNAGGLETOOTH_LIBRETRO_BUILD_TESTS=OFF
          cmake --build "$GITHUB_WORKSPACE/build-release" --parallel

      - name: Package
        env:
          ASSET: snaggletooth_libretro-linux-arm64
        run: |
          set -eu
          sh "$GITHUB_WORKSPACE/scripts/package.sh" \
            "$GITHUB_WORKSPACE/build-release/snaggletooth_libretro.so" \
            "$GITHUB_WORKSPACE/build-release/package" \
            "$GITHUB_WORKSPACE/$ASSET.zip" \
            "$ASSET"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snaggletooth_libretro-linux-arm64
          path: snaggletooth_libretro-linux-arm64.zip
          if-no-files-found: error

  # ── Windows ARM64 (WINMACARM64) — last on the shared host ────────────────────
  windows-arm64:
    name: Windows ARM64 (WINMACARM64)
    runs-on: [self-hosted, ARM64, Windows, WINMACARM64]
    needs: [guard-version, linux-arm64]
    # Same: one at a time on the shared host, gated on the version guard.
    if: ${{ always() && needs.guard-version.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build the core
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\snaggletooth-libretro-release-build `
            -G "Visual Studio 17 2022" -A ARM64 -DSNAGGLETOOTH_LIBRETRO_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:\snaggletooth-libretro-release-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: powershell
        run: |
          $asset = "snaggletooth_libretro-windows-arm64"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\package.ps1" `
            -Module C:\snaggletooth-libretro-release-build\Release\snaggletooth_libretro.dll `
            -WorkDir C:\snaggletooth-libretro-release-build\package `
            -Output "$env:GITHUB_WORKSPACE\$asset.zip" `
            -Asset $asset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snaggletooth_libretro-windows-arm64
          path: snaggletooth_libretro-windows-arm64.zip
          if-no-files-found: error
